<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftRx — Keyboard-First Prescription</title>
    <meta name="description" content="Ultra-low-latency digital prescription pad for clinicians." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; }
      body { background: #0c1122; color: #eef0f4; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #2a3149; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input, textarea, select { caret-color: #10b981; }
      /* Keep the printable overlay off the live screen — only show it during print. */
      #print-area { display: none; }
      @media print {
        @page { size: A5; margin: 12mm; }
        html, body { background: white !important; }
        body * { visibility: hidden !important; }
        #print-area {
          display: block !important;
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          background: white !important;
          color: #111 !important;
          padding: 0 !important;
          z-index: 99999 !important;
        }
        #print-area, #print-area * { visibility: visible !important; }
        /* Avoid awkward page splits inside the Rx and signature. */
        #print-area table { page-break-inside: avoid; }
        #print-area tr { page-break-inside: avoid; }
      }
      *:focus { outline: none; }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <div id="print-area"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
