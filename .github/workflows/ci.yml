# Formatting, lint, type checks, unit tests and a production build, on every
# push and pull request. `npm run check` runs the same steps locally.
#
# The steps are split into separate jobs so a lint failure is not hidden behind a
# slow build, and each job can fail (and be re-run) on its own.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: tsc
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vitest with coverage
        run: npm run test:coverage

      # Keep the HTML report and lcov so a reviewer can download them from the
      # run.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # The unit tests run the API on PGlite. This runs the Docker path from the
  # README on a real Postgres (start, migrate, seed, the health route), then
  # the API tests again against that Postgres.
  database:
    name: Postgres (Docker)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://swiftrx:swiftrx@localhost:5432/swiftrx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Postgres, migrate and seed
        run: npm run db:up

      - name: Set up again (must skip the seed, not fail)
        run: npm run db:setup | tee setup.log && grep -q 'seed was skipped' setup.log

      - name: Health route against Postgres
        run: |
          npm start -w @swiftrx/api &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5176/api/health && exit 0
            sleep 1
          done
          exit 1

      # Last, because the seed and sign-in tests wipe the database before each
      # suite. They share that one database, so one file at a time.
      - name: API tests against Postgres
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run apps/api --no-file-parallelism

      - name: Stop Postgres
        if: always()
        run: docker compose down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Vite's dep pre-bundling is the slow part of a cold rebuild. It depends
      # only on package-lock.json, so it is safe to key on that.
      - name: Cache Vite dep pre-bundling
        uses: actions/cache@v6
        with:
          path: |
            apps/*/node_modules/.vite
            node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-vite-

      # Both apps, and the demo database snapshot the production server
      # starts from.
      - name: Build all apps
        run: npm run build

      # No password, hash or bcrypt code in what browsers download.
      - name: Check the bundles for secrets
        run: npm run check:bundles

      # Starts the production server and checks the CSP, HSTS and the other
      # security headers on its pages, files and API.
      - name: Check the security headers
        run: npm run check:headers

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            apps/admin/dist
            apps/doctor-portal/dist
          retention-days: 7
