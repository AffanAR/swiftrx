<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftRx Doctor Portal</title>
    <meta name="description" content="Doctor login portal for SwiftRx-powered hospitals." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; }
      body { background: #0c1122; color: #eef0f4; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #2a3149; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input, textarea, select { caret-color: #10b981; }
      /* Keyboard focus ring (focus-visible, so mouse clicks don't show it). Text
         fields are left out: they show focus with their own border / glow. */
      *:focus { outline: none; }
      :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
      textarea:focus-visible,
      input:not([type="color"], [type="checkbox"], [type="radio"]):focus-visible { outline: none; }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
