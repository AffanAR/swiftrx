<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftRx Admin · Platform Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pick the theme before first paint (same rules as apps/shared/src/theme.ts):
      // the user's choice in this browser, else the OS setting.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('swiftrx:theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) {
            t = 'dark';
          }
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: rgb(var(--ink-900, 12 17 34));
        color: rgb(var(--ink-100, 238 240 244));
      }
      /* Keyboard focus ring (focus-visible, so mouse clicks don't show it). Text
         fields are left out: they show focus with their own border / glow. */
      *:focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid rgb(var(--rx-focus, 59 130 246));
        outline-offset: 2px;
      }
      textarea:focus-visible,
      input:not([type='color'], [type='checkbox'], [type='radio']):focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
