# =============================================================================
#  SwiftRx — Production deployment example
# =============================================================================
#  Drop this snippet into your nginx config, replace `swiftrx.com` with your
#  domain, and `*.swiftrx.com` A/AAAA records with a wildcard pointing at the
#  load balancer. The same routing logic the dev gateway uses is replicated
#  here, just declared in nginx.
# =============================================================================

# Admin panel: admin.swiftrx.com (and root for now)
server {
    listen 443 ssl http2;
    server_name admin.swiftrx.com swiftrx.com www.swiftrx.com;

    ssl_certificate     /etc/letsencrypt/live/swiftrx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swiftrx.com/privkey.pem;

    root /var/www/swiftrx/admin/dist;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets get long-lived caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Per-hospital portal: <slug>.swiftrx.com
server {
    listen 443 ssl http2;
    server_name ~^(?<slug>[^.]+)\.swiftrx\.com$;

    ssl_certificate     /etc/letsencrypt/live/swiftrx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swiftrx.com/privkey.pem;

    # The doctor-portal SPA is the same bundle for every tenant; the app
    # reads its tenant from window.location.hostname on boot.
    root /var/www/swiftrx/portal/dist;
    index index.html;

    # /rx → the Rx Pad bundle for the current tenant.
    location /rx/ {
        alias /var/www/swiftrx/rx/dist/;
        try_files $uri $uri/ /index.html;
    }
    location /rx {
        rewrite ^/rx$ /rx/ permanent;
    }

    # Everything else → the portal SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
